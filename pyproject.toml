[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mudidi"
version = "0.1.0"
description = "Dictionary OCR and MDF extraction pipeline with benchmark and inference modes."
requires-python = ">=3.11"

dependencies = [
    "litellm>=1.87.0",
    "python-docx",
    "Pillow",
    "pydantic",
    "python-dotenv",
    "numpy",
    "python-Levenshtein",
    "grapheme",
    "jiwer",
    "jinja2>=3.1",
    "pymupdf>=1.27.2.2",
    "scipy>=1.15.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.12",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.29",
    "pymdown-extensions>=10.0",
]
paddle = [
    "paddlepaddle",
    "paddleocr",
]
web = [
    "cryptography>=45.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[project.scripts]
mudidi = "mudidi.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mudidi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "annotation/tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: live LLM API calls (set MUDIDI_LLM_INTEGRATION=1)",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = true
